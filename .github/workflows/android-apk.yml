name: Build APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/android/**'
      - 'packages/api/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-apk:
    name: Gerar APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build da Web (bundle para o Capacitor)
        run: npm run build --workspace apps/web

      - name: Sync Capacitor
        working-directory: apps/android
        run: npx cap sync android

      - name: Build APK debug
        run: |
          cd apps/android/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee build-debug.log
          exit ${PIPESTATUS[0]}
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Build APK release (não assinado)
        run: |
          cd apps/android/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease --stacktrace 2>&1 | tee build-release.log
          exit ${PIPESTATUS[0]}
        continue-on-error: true
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload log de diagnóstico (se falhou)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hudplay-gradle-logs
          path: apps/android/android/build-*.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hudplay-apk
          path: |
            apps/android/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn